<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 → SRT</title>
<meta name="description" content="Lokální přepis MP3 do SRT pomocí Whisperu v prohlížeči.">
<style>
:root{color-scheme:light dark;--bg:#eef2f7;--card:#fff;--soft:#f7f9fc;--text:#172033;--muted:#657087;--line:#d8deea;--accent:#315ee7;--ok:#17834c;--warn:#9a5d00;--err:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0d1220;--card:#171e2e;--soft:#111827;--text:#edf2ff;--muted:#aab4ca;--line:#303a51;--accent:#7698ff;--ok:#60d394;--warn:#ffc66d;--err:#ff8e86}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}main{width:min(1120px,calc(100% - 28px));margin:auto;padding:34px 0 60px}h1{font-size:clamp(2rem,5vw,3.3rem);margin:0 0 6px}h2{font-size:1.15rem;margin:0 0 14px}.lead,.muted{color:var(--muted)}.lead{margin:0 0 22px}.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 50px #0002}.stack{display:grid;gap:14px}.drop{display:grid;place-items:center;min-height:170px;padding:24px;text-align:center;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:16px;background:var(--soft);cursor:pointer}.drop.drag{border-color:var(--accent)}.drop strong{display:block;margin-bottom:6px}.drop span{color:var(--muted);font-size:.92rem}#file{display:none}.filebox{display:none;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);overflow-wrap:anywhere}audio{width:100%;margin-top:9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label.field{display:grid;gap:6px;color:var(--muted);font-size:.88rem}select,input,textarea{width:100%;font:inherit;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:11px}select,input{min-height:44px;padding:8px 10px}textarea{min-height:390px;padding:14px;resize:vertical;line-height:1.48}button{min-height:44px;padding:10px 15px;border:0;border-radius:11px;font:700 .95rem system-ui;cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.status,.progressbox{padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft)}.status{min-height:68px;color:var(--muted)}.status[data-kind=ok]{color:var(--ok)}.status[data-kind=warn]{color:var(--warn)}.status[data-kind=error]{color:var(--err)}.progressbox{display:grid;gap:8px}.progresshead{display:flex;justify-content:space-between;align-items:baseline}.percent{font-size:1.5rem;color:var(--accent);font-variant-numeric:tabular-nums}progress{width:100%;height:15px;accent-color:var(--accent)}.small{font-size:.84rem;color:var(--muted);margin:0}.hidden{display:none!important}.outhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tabs,.buttons{display:flex;gap:8px;flex-wrap:wrap}.tab.active{background:var(--accent);color:#fff}.buttons{margin-top:12px}.buttons button{flex:1 1 140px}.badge{display:inline-block;margin-top:5px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.78rem}@media(max-width:820px){.grid{grid-template-columns:1fr}}@media(max-width:520px){.form{grid-template-columns:1fr}.card{padding:15px}.outhead{align-items:flex-start;flex-direction:column;gap:10px}}
</style>
</head>
<body>
<main>
<h1>MP3 → SRT</h1>
<p class="lead">Bezplatný lokální přepis pomocí Whisperu. Zvuk zůstává v počítači; z internetu se stáhne jen knihovna a model.</p>
<div class="grid">
<section class="card stack">
<h2>1. Zvuk a nastavení</h2>
<label class="drop" id="drop" for="file"><div><strong>Vyber MP3 nebo ho sem přetáhni</strong><span>Podporovány jsou také WAV, M4A, OGG a FLAC.</span></div></label>
<input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac">
<div class="filebox" id="filebox"><strong id="filename"></strong><div class="small" id="filemeta"></div><audio id="preview" controls></audio></div>
<div class="form">
<label class="field">Model<select id="model"><option value="onnx-community/whisper-tiny">Tiny – nejrychlejší</option><option value="onnx-community/whisper-base" selected>Base – doporučeno</option><option value="onnx-community/whisper-small">Small – nejpřesnější, náročný</option></select></label>
<label class="field">Jazyk nahrávky<select id="language"><option value="slovak" selected>Slovenština</option><option value="czech">Čeština</option><option value="">Automaticky rozpoznat</option></select></label>
<label class="field">Výpočet<select id="device"><option value="auto" selected>Automaticky</option><option value="webgpu">WebGPU – grafická karta</option><option value="wasm">WASM – procesor</option></select></label>
<label class="field">Max. délka titulku<select id="maxdur"><option value="4.5">4,5 sekundy</option><option value="5.5" selected>5,5 sekundy</option><option value="7">7 sekund</option></select></label>
<label class="field">Znaků na řádek<input id="chars" type="number" min="24" max="60" value="42"></label>
<label class="field">Řádků v titulku<select id="lines"><option value="1">1 řádek</option><option value="2" selected>2 řádky</option></select></label>
</div>
<button class="primary" id="start" disabled>Vytvořit titulky</button>
<div class="status" id="status">Vyber zvukový soubor.</div>
<div class="progressbox hidden" id="progressbox"><div class="progresshead"><strong id="stage">Příprava</strong><strong class="percent" id="percent">0 %</strong></div><progress id="progress" max="100" value="0"></progress><p class="small" id="detail">Čekám na spuštění.</p></div>
</section>
<section class="card">
<div class="outhead"><div><h2>2. Výsledek</h2><span class="badge" id="count">0 titulků</span></div><div class="tabs"><button class="secondary tab active" id="srtTab">SRT</button><button class="secondary tab" id="txtTab">Čistý text</button></div></div>
<textarea id="srt" placeholder="Zde se objeví časované titulky…"></textarea><textarea id="txt" class="hidden" placeholder="Zde se objeví přepis…"></textarea>
<div class="buttons"><button class="primary" id="saveSrt" disabled>Stáhnout SRT</button><button class="secondary" id="saveTxt" disabled>Stáhnout TXT</button><button class="secondary" id="copy" disabled>Kopírovat</button></div>
</section>
</div>
</main>
<script type="module">
import{pipeline,env}from'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
env.allowLocalModels=false;env.useBrowserCache=true;
const SR=16000,CHUNK=25,OVERLAP=1.5,$=id=>document.getElementById(id);
const file=$('file'),drop=$('drop'),filebox=$('filebox'),filename=$('filename'),filemeta=$('filemeta'),preview=$('preview'),start=$('start'),status=$('status'),progressbox=$('progressbox'),progress=$('progress'),stage=$('stage'),percent=$('percent'),detail=$('detail'),srt=$('srt'),txt=$('txt'),count=$('count'),saveSrt=$('saveSrt'),saveTxt=$('saveTxt'),copy=$('copy');
let chosen=null,url=null,duration=0,pipe=null,pipeKey='',active='srt';
function clean(v){return String(v??'').replace(/\s+/g,' ').replace(/\s+([,.;:!?])/g,'$1').trim()}
function setStatus(t,k=''){status.textContent=t;status.dataset.kind=k}
function setProgress(v,s='Pracuji',d=''){v=Math.max(0,Math.min(100,Number(v)||0));progressbox.classList.remove('hidden');progress.value=v;stage.textContent=s;percent.textContent=`${Math.round(v)} %`;detail.textContent=d||'Probíhá zpracování…'}
function bytes(n){for(var u=['B','kB','MB','GB'],i=0;n>=1000&&i<3;i++)n/=1000;return`${n.toFixed(i?1:0)} ${u[i]}`}
function time(s){if(!Number.isFinite(s))return'neznámá délka';let h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function choose(f){if(!f)return;if(!f.type.startsWith('audio/')&&!/\.(mp3|wav|m4a|ogg|flac)$/i.test(f.name)){setStatus('Soubor nevypadá jako zvuk.','error');return}chosen=f;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);preview.src=url;filename.textContent=f.name;filemeta.textContent=bytes(f.size);filebox.style.display='block';start.disabled=false;setStatus('Soubor je připraven. Spusť přepis.')}
file.addEventListener('change',()=>choose(file.files?.[0]));for(const e of['dragenter','dragover'])drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')});for(const e of['dragleave','drop'])drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>choose(e.dataTransfer.files?.[0]));preview.addEventListener('loadedmetadata',()=>{duration=preview.duration;filemeta.textContent=`${bytes(chosen.size)} • ${time(duration)}`});
function getDevice(){let d=$('device').value;if(d==='wasm')return'wasm';if(d==='webgpu'){if(!navigator.gpu)throw Error('WebGPU není dostupné. Zvol Automaticky nebo WASM.');return'webgpu'}return navigator.gpu?'webgpu':'wasm'}
async function loadPipe(model,device){let key=`${model}|${device}`;if(pipe&&pipeKey===key)return pipe;if(pipe?.dispose)try{await pipe.dispose()}catch{}pipe=null;pipeKey='';setProgress(0,'Načítám model','Při prvním použití se model stahuje.');let map=new Map;const cb=d=>{if(d.status==='progress'&&typeof d.progress==='number'){map.set(d.file??d.name??map.size,d.progress);let a=[...map.values()].reduce((x,y)=>x+y,0)/map.size;setProgress(a,'Stahuji model',`${Math.round(a)} %`);setStatus(`Stahuji model: ${Math.round(a)} %`)}};let opt={device,progress_callback:cb};try{pipe=await pipeline('automatic-speech-recognition',model,{...opt,dtype:device==='webgpu'?'fp16':'q8'})}catch(e){console.warn(e);setStatus('Zkouším kompatibilní variantu modelu…','warn');pipe=await pipeline('automatic-speech-recognition',model,opt)}pipeKey=key;setProgress(100,'Model je připraven','Následuje příprava zvuku.');return pipe}
async function decode(f){setProgress(0,'Připravuji zvuk',`Načítám ${bytes(f.size)}.`);const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Prohlížeč nepodporuje Web Audio API.');let c;try{c=new AC({sampleRate:SR})}catch{c=new AC}let b=await f.arrayBuffer();setProgress(35,'Připravuji zvuk','Dekóduji MP3…');let a=await c.decodeAudioData(b.slice(0)),mono=new Float32Array(a.length);setProgress(65,'Připravuji zvuk','Převádím zvuk do mono.');for(let ch=0;ch<a.numberOfChannels;ch++){let x=a.getChannelData(ch);for(let i=0;i<x.length;i++)mono[i]+=x[i]/a.numberOfChannels}if(a.sampleRate!==SR){setProgress(82,'Připravuji zvuk',`Převádím ${a.sampleRate} Hz na 16 kHz.`);mono=resample(mono,a.sampleRate,SR)}duration=mono.length/SR;await c.close();setProgress(100,'Zvuk je připraven',`${time(duration)} zvuku.`);return mono}
function resample(a,rin,rout){if(rin===rout)return a;let r=rin/rout,o=new Float32Array(Math.max(1,Math.round(a.length/r)));for(let i=0;i<o.length;i++){let p=i*r,l=Math.floor(p),q=Math.min(l+1,a.length-1),f=p-l;o[i]=a[l]*(1-f)+a[q]*f}return o}
function err(e){return e instanceof Error?e.message:String(e)}
function recoverable(e){return/token_ids must be a non-empty array|timestamp|cross attentions?|ending timestamp|empty array/i.test(err(e))}
function level(a){if(!a.length)return{rms:0,peak:0};let step=Math.max(1,Math.floor(a.length/4000)),sum=0,peak=0,n=0;for(let i=0;i<a.length;i+=step){let v=Math.abs(a[i]);sum+=v*v;peak=Math.max(peak,v);n++}return{rms:Math.sqrt(sum/Math.max(1,n)),peak}}
function silent(a){let x=level(a);return x.rms<.0008&&x.peak<.008}
function opts(lang,ts){let o={task:'transcribe',force_full_sequences:false};if(ts)o.return_timestamps=true;if(lang)o.language=lang;return o}
function dedupe(prev,cur){let a=clean(prev).split(' '),b=clean(cur).split(' '),m=Math.min(12,a.length,b.length);for(let n=m;n>=2;n--)if(a.slice(-n).join(' ').toLowerCase()===b.slice(0,n).join(' ').toLowerCase())return b.slice(n).join(' ');return b.join(' ')}
async function safeChunk(transcriber,a,lang,retry){if(silent(a))return{text:'',chunks:[],silence:true};let first;try{return await transcriber(a,opts(lang,true))}catch(e){if(!recoverable(e))throw e;first=e;console.warn(e);retry('Časové značky této části selhaly. Zkouším přepis bez nich…')}try{return await transcriber(a,opts(lang,false))}catch(e){if(!recoverable(e))throw e;console.warn(e);retry('Bezpečný režim selhal. Dělím část na dvě poloviny…')}if(a.length>=8*SR){let mid=Math.floor(a.length/2),pieces=[[0,mid],[mid,a.length]],chunks=[],text='';for(const [st,en]of pieces){let part=a.slice(st,en);if(silent(part))continue;try{let r=await transcriber(part,opts(lang,false)),t=clean(r?.text);if(!t)continue;if(text)t=dedupe(text,t);t=clean(t);if(!t)continue;text=clean(`${text} ${t}`);chunks.push({text:t,timestamp:[st/SR,en/SR]})}catch(e){if(!recoverable(e))throw e;console.warn(e)}}if(text)return{text,chunks,recovered:true}}return{text:'',chunks:[],skipped:true,warning:err(first)}}
function normalize(chunks,start,end,accept){let out=[],last=start;for(const c of chunks??[]){let text=clean(c.text);if(!text)continue;let t=Array.isArray(c.timestamp)?c.timestamp:[0,null],s=Number.isFinite(t[0])?start+t[0]:last,e=Number.isFinite(t[1])?start+t[1]:Math.min(end,s+Math.max(.8,text.length/13));s=Math.max(start,s);e=Math.min(end,Math.max(s+.08,e));if(e<=accept||(s<accept&&(s+e)/2<=accept))continue;s=Math.max(s,accept);last=e;out.push({text,start:s,end:e})}return out}
function merge(target,adds){for(let a of adds){let p=target.at(-1);if(p&&a.start<=p.end+1.5)a.text=dedupe(p.text,a.text);a.text=clean(a.text);if(!a.text)continue;if(p&&a.start<p.end)a.start=Math.max(p.start+.05,p.end-.05);if(a.end<=a.start)a.end=a.start+.5;target.push(a)}}
async function transcribe(transcriber,a,lang){let size=Math.round(CHUNK*SR),ov=Math.round(OVERLAP*SR),step=size-ov,total=Math.max(1,Math.ceil(Math.max(1,a.length-ov)/step)),segments=[],texts=[],recovered=0,skipped=0;for(let i=0;i<total;i++){let ss=i*step;if(ss>=a.length)break;let ee=Math.min(a.length,ss+size),st=ss/SR,en=ee/SR,before=st/duration*100;setProgress(before,'Přepisuji zvuk',`${time(st)} z ${time(duration)} • část ${i+1} z ${total}`);setStatus(`Přepisuji část ${i+1} z ${total} (${Math.round(before)} %)…`);let r=await safeChunk(transcriber,a.slice(ss,ee),lang,m=>{setProgress(before,'Opravuji problémovou část',`část ${i+1} z ${total}`);setStatus(m,'warn')});if(r.recovered)recovered++;if(r.skipped)skipped++;let rt=clean(r.text),accept=i?st+OVERLAP:st,seg=normalize(r.chunks,st,en,accept);if(!seg.length&&rt)seg=[{text:rt,start:accept,end:en}];if(rt){let p=texts.at(-1)||'',d=p?dedupe(p,rt):rt;if(d)texts.push(d)}merge(segments,seg);setProgress(en/duration*100,'Přepisuji zvuk',`${time(en)} z ${time(duration)} • hotovo ${i+1} z ${total}`);await new Promise(r=>setTimeout(r,0))}return{text:clean(texts.join(' ')),segments,recovered,skipped}}
function wrap(text,max,lines){text=clean(text);if(lines===1||text.length<=max)return text;let words=text.split(' '),target=Math.ceil(text.length/lines),out=[],cur='';for(const w of words){let c=cur?`${cur} ${w}`:w;if(out.length<lines-1&&cur&&c.length>target){out.push(cur);cur=w}else cur=c}if(cur)out.push(cur);return out.join('\n')}
function captions(segments,settings){let words=[];for(const s of segments){let p=clean(s.text).split(/\s+/).filter(Boolean),dur=Math.max(.4,s.end-s.start),weights=p.map(w=>Math.max(1,w.replace(/[^\p{L}\p{N}]/gu,'').length)),sum=weights.reduce((a,b)=>a+b,0),cur=s.start;p.forEach((w,i)=>{let e=i===p.length-1?s.end:Math.min(s.end,cur+dur*weights[i]/sum);words.push({text:w,start:cur,end:Math.max(cur+.04,e)});cur=e})}let out=[],c=null,max=settings.chars*settings.lines,flush=()=>{if(!c)return;out.push({start:c.start,end:Math.max(c.end,c.start+.65),text:wrap(c.text,settings.chars,settings.lines)});c=null};for(const w of words){if(!c){c={...w};continue}let candidate=clean(`${c.text} ${w.text}`),too=candidate.length>max||w.end-c.start>settings.maxdur;if(too)flush();if(!c)c={...w};else{c.text=candidate;c.end=w.end}if(/[.!?…][”"')\]]?$/.test(c.text)&&c.end-c.start>=1.1)flush()}flush();for(let i=0;i<out.length-1;i++)out[i].end=Math.min(out[i].end,Math.max(out[i].start+.35,out[i+1].start-.04));return out}
function fallback(text,dur,set){let words=clean(text).split(/\s+/).filter(Boolean),out=[],max=set.chars*set.lines,parts=[],buf='';for(const w of words){let c=buf?`${buf} ${w}`:w;if(c.length>max&&buf){parts.push(buf);buf=w}else buf=c}if(buf)parts.push(buf);let total=Math.max(1,parts.reduce((a,b)=>a+b.length,0)),cur=0;for(const p of parts){let d=Math.max(.8,dur*p.length/total);out.push({start:cur,end:cur+d,text:wrap(p,set.chars,set.lines)});cur+=d}return out}
function srtTime(s){let n=Math.max(0,Math.round(s*1000)),ms=n%1000,ts=Math.floor(n/1000),sec=ts%60,tm=Math.floor(ts/60),min=tm%60,h=Math.floor(tm/60);return`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')},${String(ms).padStart(3,'0')}`}
function toSrt(c){return c.map((x,i)=>`${i+1}\n${srtTime(x.start)} --> ${srtTime(x.end)}\n${x.text}`).join('\n\n')}
function busy(v){start.disabled=v||!chosen;file.disabled=v;for(const id of['model','language','device','maxdur','chars','lines'])$(id).disabled=v}
start.addEventListener('click',async()=>{if(!chosen)return;busy(true);saveSrt.disabled=saveTxt.disabled=copy.disabled=true;srt.value=txt.value='';count.textContent='0 titulků';try{let transcriber=await loadPipe($('model').value,getDevice()),audio=await decode(chosen),r=await transcribe(transcriber,audio,$('language').value),plain=clean(r.text||r.segments.map(x=>x.text).join(' ')),set={maxdur:Number($('maxdur').value),chars:Number($('chars').value),lines:Number($('lines').value)},cap=captions(r.segments,set);if(!cap.length&&plain)cap=fallback(plain,duration,set);if(!plain&&!cap.length)throw Error('Model nevrátil žádný text. Zkontroluj hlasitost nebo zkus jiný model.');srt.value=toSrt(cap);txt.value=plain||cap.map(x=>x.text.replace(/\n/g,' ')).join(' ');count.textContent=`${cap.length} titulků`;saveSrt.disabled=!srt.value;saveTxt.disabled=!txt.value;copy.disabled=false;let note=r.recovered?` ${r.recovered} problémových částí bylo zachráněno.`:'',warn=r.skipped?` Pozor: ${r.skipped} částí bylo přeskočeno.`:'';setProgress(100,'Hotovo',`Vytvořeno ${cap.length} titulků.${note}${warn}`);setStatus(`Hotovo. Vytvořeno ${cap.length} titulků.${note}${warn}`,r.skipped?'warn':'ok')}catch(e){console.error(e);stage.textContent='Přepis selhal';detail.textContent=err(e);setStatus(`Přepis se nepodařil: ${err(e)}`,'error')}finally{busy(false)}});
function base(){return(chosen?.name||'prepis').replace(/\.[^.]+$/,'').replace(/[\\/:*?"<>|]+/g,'_')}function save(content,ext,mime){let b=new Blob(['\ufeff',content],{type:`${mime};charset=utf-8`}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`${base()}.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}saveSrt.onclick=()=>save(srt.value,'srt','application/x-subrip');saveTxt.onclick=()=>save(txt.value,'txt','text/plain');copy.onclick=async()=>{let v=active==='srt'?srt.value:txt.value;try{await navigator.clipboard.writeText(v)}catch{let a=active==='srt'?srt:txt;a.select();document.execCommand('copy')}setStatus('Text byl zkopírován.','ok')};function tab(t){active=t;let x=t==='srt';srt.classList.toggle('hidden',!x);txt.classList.toggle('hidden',x);$('srtTab').classList.toggle('active',x);$('txtTab').classList.toggle('active',!x)}$('srtTab').onclick=()=>tab('srt');$('txtTab').onclick=()=>tab('txt');window.addEventListener('beforeunload',()=>url&&URL.revokeObjectURL(url));
</script>
</body>
</html>
