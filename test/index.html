<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MP3 → SRT</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0d1220; }
    iframe { display: block; width: 100%; height: 100vh; border: 0; }
  </style>
</head>
<body>
  <iframe id="app" src="./stable.html?v=20261001-batch-stall-fix" title="MP3 → SRT"></iframe>

  <script>
    const frame = document.getElementById('app');

    frame.addEventListener('load', () => {
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      const fileInput = d.getElementById('file');
      const drop = d.getElementById('drop');
      const fileBox = d.getElementById('filebox');
      const startButton = d.getElementById('start');
      const statusBox = d.getElementById('status');
      const saveSrt = d.getElementById('saveSrt');
      const srtOutput = d.getElementById('srt');

      if (!fileInput || !drop || !fileBox || !startButton || !statusBox || !saveSrt || !srtOutput) return;

      fileInput.multiple = true;

      const title = drop.querySelector('strong');
      const note = drop.querySelector('span');
      if (title) title.textContent = 'Vyber jeden nebo více MP3 souborů';
      if (note) note.textContent = 'Soubory se zpracují postupně a každý hotový SRT se automaticky stáhne.';

      const queueBox = d.createElement('div');
      queueBox.className = 'status';
      queueBox.style.minHeight = '0';
      queueBox.style.display = 'none';
      fileBox.insertAdjacentElement('afterend', queueBox);

      let queue = [];
      let currentIndex = 0;
      let running = false;
      let handlingResult = false;
      let internalChange = false;
      let internalStart = false;
      const results = [];

      const isAudio = (file) => file && (
        file.type.startsWith('audio/') || /\.(mp3|wav|m4a|ogg|flac)$/i.test(file.name)
      );

      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      function renderQueue(extra = '') {
        if (!queue.length) {
          queueBox.style.display = 'none';
          return;
        }

        queueBox.style.display = 'block';
        const current = Math.min(currentIndex + 1, queue.length);
        const finished = results.filter((item) => item === 'ok').length;
        const failed = results.filter((item) => item === 'error').length;
        const currentName = queue[currentIndex]?.name ?? '';
        const state = running
          ? `Zpracovávám ${current}/${queue.length}: ${currentName}`
          : `Ve frontě: ${queue.length} souborů`;
        const summary = results.length ? ` • hotovo ${finished}${failed ? `, chyby ${failed}` : ''}` : '';
        queueBox.textContent = `${state}${summary}${extra ? ` • ${extra}` : ''}`;
      }

      function setQueue(files) {
        queue = Array.from(files || []).filter(isAudio);
        currentIndex = 0;
        running = false;
        handlingResult = false;
        results.length = 0;
        renderQueue(queue.length > 1 ? 'prohlížeč může požádat o povolení více automatických stahování' : '');
        startButton.textContent = queue.length > 1
          ? `Vytvořit titulky (${queue.length} souborů)`
          : 'Vytvořit titulky';
      }

      fileInput.addEventListener('change', () => {
        if (!internalChange) setQueue(fileInput.files);
      });

      drop.addEventListener('drop', (event) => {
        if (!internalChange) setQueue(event.dataTransfer?.files);
      });

      startButton.addEventListener('click', () => {
        if (internalStart) return;
        if (!queue.length && fileInput.files?.length) setQueue(fileInput.files);
        if (!queue.length) return;
        currentIndex = 0;
        results.length = 0;
        running = true;
        handlingResult = false;
        renderQueue('automatické stahování SRT je zapnuté');
      });

      async function downloadCurrentSrt() {
        if (!srtOutput.value.trim()) throw new Error('SRT je prázdné.');
        if (saveSrt.disabled) throw new Error('SRT ještě není připravené ke stažení.');
        saveSrt.click();
      }

      async function loadAndStart(index) {
        const file = queue[index];
        if (!file) return;

        const transfer = new w.DataTransfer();
        transfer.items.add(file);
        internalChange = true;
        fileInput.files = transfer.files;
        fileInput.dispatchEvent(new w.Event('change', { bubbles: true }));
        internalChange = false;

        await delay(250);
        internalStart = true;
        startButton.click();
        internalStart = false;
      }

      async function advance() {
        currentIndex += 1;
        if (currentIndex >= queue.length) {
          running = false;
          handlingResult = false;
          const failed = results.filter((item) => item === 'error').length;
          renderQueue(failed ? `fronta dokončena, ${failed} souborů selhalo` : 'fronta dokončena');
          startButton.textContent = queue.length > 1
            ? `Spustit frontu znovu (${queue.length})`
            : 'Vytvořit titulky';
          return;
        }

        renderQueue('načítám další soubor');
        await delay(500);
        handlingResult = false;
        await loadAndStart(currentIndex);
      }

      async function handleSuccess() {
        if (!running || handlingResult) return;
        handlingResult = true;
        try {
          await downloadCurrentSrt();
          results[currentIndex] = 'ok';
          renderQueue(`SRT ${currentIndex + 1}/${queue.length} staženo`);
        } catch (error) {
          console.error('Automatické stažení SRT selhalo:', error);
          results[currentIndex] = 'error';
          renderQueue(`stažení SRT selhalo: ${error.message || error}`);
        }
        await advance();
      }

      async function handleFailure() {
        if (!running || handlingResult) return;
        handlingResult = true;
        results[currentIndex] = 'error';
        renderQueue(`soubor ${currentIndex + 1}/${queue.length} se nepodařilo přepsat, pokračuji`);
        await advance();
      }

      const observer = new w.MutationObserver(() => {
        if (!running) return;
        const text = statusBox.textContent.trim();
        const kind = statusBox.dataset.kind;
        if (kind === 'ok' && /^Hotovo\./.test(text)) {
          handleSuccess();
        } else if (kind === 'error' && /^Přepis se nepodařil:/.test(text)) {
          handleFailure();
        }
      });

      observer.observe(statusBox, {
        childList: true,
        subtree: true,
        characterData: true,
        attributes: true,
        attributeFilter: ['data-kind'],
      });
    });
  </script>

  <script>
    (() => {
      const frame = document.getElementById('app');
      let wakeLock = null;
      let keepAwakeVideo = null;
      let keepAwakeCanvas = null;
      let keepAwakeStream = null;
      let frameTimer = null;
      let stopTimer = null;
      let active = false;

      function startPixelVideo() {
        if (!keepAwakeVideo) {
          keepAwakeVideo = document.createElement('video');
          keepAwakeVideo.muted = true;
          keepAwakeVideo.playsInline = true;
          keepAwakeVideo.loop = true;
          keepAwakeVideo.setAttribute('aria-hidden', 'true');
          Object.assign(keepAwakeVideo.style, {
            position: 'fixed',
            width: '1px',
            height: '1px',
            left: '0',
            bottom: '0',
            opacity: '0.001',
            pointerEvents: 'none',
            zIndex: '-1',
          });
          document.body.appendChild(keepAwakeVideo);
        }

        if (!keepAwakeStream) {
          keepAwakeCanvas = document.createElement('canvas');
          keepAwakeCanvas.width = 1;
          keepAwakeCanvas.height = 1;
          const context = keepAwakeCanvas.getContext('2d');
          let phase = false;

          const draw = () => {
            if (!context) return;
            context.fillStyle = phase ? '#000000' : '#010101';
            context.fillRect(0, 0, 1, 1);
            phase = !phase;
          };

          draw();
          frameTimer = window.setInterval(draw, 1000);

          if (typeof keepAwakeCanvas.captureStream === 'function') {
            keepAwakeStream = keepAwakeCanvas.captureStream(1);
            keepAwakeVideo.srcObject = keepAwakeStream;
          }
        }

        const promise = keepAwakeVideo.play();
        if (promise?.catch) promise.catch(() => {});
      }

      async function requestWakeLock() {
        if (!active || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;
        try {
          if (!wakeLock || wakeLock.released) {
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
              wakeLock = null;
            }, { once: true });
          }
        } catch (error) {
          console.warn('Screen Wake Lock není dostupný:', error);
        }
      }

      async function startKeepAwake() {
        if (stopTimer) {
          clearTimeout(stopTimer);
          stopTimer = null;
        }
        active = true;
        startPixelVideo();
        await requestWakeLock();
      }

      async function stopKeepAwakeNow() {
        active = false;

        if (wakeLock) {
          try { await wakeLock.release(); } catch (_) {}
          wakeLock = null;
        }

        if (frameTimer !== null) {
          clearInterval(frameTimer);
          frameTimer = null;
        }

        if (keepAwakeVideo) {
          try { keepAwakeVideo.pause(); } catch (_) {}
          keepAwakeVideo.srcObject = null;
        }

        if (keepAwakeStream) {
          for (const track of keepAwakeStream.getTracks()) track.stop();
          keepAwakeStream = null;
        }

        keepAwakeCanvas = null;
      }

      function scheduleStop() {
        if (stopTimer) clearTimeout(stopTimer);
        // Krátká prodleva zachová video při automatickém přechodu na další MP3 ve frontě.
        stopTimer = setTimeout(() => {
          stopTimer = null;
          void stopKeepAwakeNow();
        }, 8000);
      }

      document.addEventListener('visibilitychange', () => {
        if (!active || document.visibilityState !== 'visible') return;
        startPixelVideo();
        void requestWakeLock();
      });

      frame.addEventListener('load', () => {
        const w = frame.contentWindow;
        const d = frame.contentDocument;
        const startButton = d?.getElementById('start');
        const statusBox = d?.getElementById('status');
        if (!startButton || !statusBox) return;

        startButton.addEventListener('click', () => {
          void startKeepAwake();
        });

        const observer = new w.MutationObserver(() => {
          const text = statusBox.textContent.trim();
          const kind = statusBox.dataset.kind;
          if ((kind === 'ok' && /^Hotovo\./.test(text)) ||
              (kind === 'error' && /^Přepis se nepodařil:/.test(text))) {
            scheduleStop();
          }
        });

        observer.observe(statusBox, {
          childList: true,
          subtree: true,
          characterData: true,
          attributes: true,
          attributeFilter: ['data-kind'],
        });
      });

      window.addEventListener('beforeunload', () => {
        void stopKeepAwakeNow();
      });
    })();
  </script>

</body>
</html>
